<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trượt Va Chạm — Mahjong × Block (prototype 12)</title>
<style>
:root{
  --wood:#2b1d16; --wood2:#3d2a20; --felt:#14342b; --felt2:#0d241d;
  --cream:#f6ecd8; --cream2:#e6d7ba; --ink:#2a2018;
  --gold:#e8b64c; --jade:#4ec98a; --danger:#ff5d51; --blue:#4a9fe0; --red:#e0553f; --green:#3fae6a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #5a3d2c 0%, var(--wood) 55%, #1b120d 100%);
  color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none; touch-action:manipulation; user-select:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:8px; padding:8px 10px 12px;}

#hud{display:flex; align-items:center; gap:8px;}
.hud-box{flex:1; background:rgba(0,0,0,.28); border:1px solid rgba(232,182,76,.22); border-radius:10px; padding:5px 8px;}
.hud-lab{font-size:9px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;}
.hud-val{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15;}
#btn-help{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(232,182,76,.22);color:var(--cream);font-size:15px;font-weight:700;}

#board-wrap{position:relative; width:100%; display:flex; justify-content:center;}
#board{
  width:min(100%, 62vh); flex:none; position:relative;
  display:grid; gap:3px; padding:6px; border-radius:14px;
  background:linear-gradient(160deg,var(--felt),var(--felt2));
  border:1px solid rgba(232,182,76,.22);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}
.cell{aspect-ratio:1; border-radius:6px; background:rgba(0,0,0,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.035); position:relative;}
.cell .tile{position:absolute; inset:0;}
.cell .tile.pop{animation:pop .22s ease-out forwards;}
@keyframes pop{0%{transform:scale(1); opacity:1}50%{transform:scale(1.3); filter:brightness(2)}100%{transform:scale(0); opacity:0}}
.cell .tile.spawn{animation:spawnin .22s ease-out;}
@keyframes spawnin{0%{transform:scale(.3); opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1); opacity:1}}
.cell .tile.slide{transition:transform .13s cubic-bezier(.3,.1,.3,1);}

/* ---------- TILE ART (copy nguyên quy ước từ prototype 11/14) ---------- */
.tile{border-radius:6px; background:linear-gradient(170deg,#fdf6e6 0%,var(--cream) 40%,var(--cream2) 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16), inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.tile svg{width:88%; height:88%; display:block;}
.tile .rk{position:absolute; top:1px; left:2.5px; font-size:8px; font-weight:800; line-height:1; opacity:.62;}
.tile.s .rk{color:var(--green)} .tile.c .rk{color:var(--blue)} .tile.w .rk{color:var(--red)} .tile.h .rk{color:#b3862a}

/* ---------- DIRECTION PAD ---------- */
#dpad{display:grid; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,44px); gap:6px; justify-content:center; margin-top:2px;}
#dpad button{border-radius:10px; border:1px solid rgba(232,182,76,.28); background:rgba(0,0,0,.3); color:var(--cream); font-size:18px; font-weight:800;}
#dpad button:active{background:rgba(232,182,76,.25);}
#d-up{grid-column:2; grid-row:1;}
#d-left{grid-column:1; grid-row:2;} #d-down{grid-column:2; grid-row:2;} #d-right{grid-column:3; grid-row:2;}

.float{position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:16px; color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,.8); animation:floatup 1s ease-out forwards;}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7); opacity:0}25%{transform:translate(-50%,-12px) scale(1.15); opacity:1}100%{transform:translate(-50%,-46px) scale(1); opacity:0}}
.spark{position:fixed; z-index:75; width:6px; height:6px; border-radius:50%; pointer-events:none;}

#ov{position:fixed; inset:0; z-index:100; background:rgba(12,8,6,.86); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:18px;}
#ov.on{display:flex;}
#ovcard{width:100%; max-width:360px; background:linear-gradient(170deg,#3d2a20,#241812); border:1px solid rgba(232,182,76,.35);
  border-radius:16px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.6); max-height:86vh; overflow:auto;}
#ovcard h2{margin:0 0 4px; font-size:20px; color:var(--gold);}
#ovcard .sub{font-size:12px; opacity:.7; margin-bottom:12px;}
#ovcard p{font-size:13px; line-height:1.55; margin:0 0 9px;}
#ovcard ul{font-size:12.5px; line-height:1.6; padding-left:17px; margin:0 0 10px;}
#ovcard .hl{color:var(--gold); font-weight:700;}
#ovcard .dg{color:var(--danger); font-weight:700;}
.btn{width:100%; padding:12px; border-radius:11px; border:0; font-size:14px; font-weight:800;
  background:linear-gradient(180deg,var(--gold),#c8912e); color:#2a1d0b; margin-top:6px;}
.demo{display:flex; gap:4px; justify-content:center; align-items:center; margin:8px 0 12px;}
.demo .tile{width:30px;height:38px;}
.demo .arw{opacity:.6; font-size:15px; padding:0 3px;}
#toast{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:90; background:rgba(20,14,10,.95);
  border:1px solid rgba(232,182,76,.4); color:var(--cream); padding:9px 14px; border-radius:10px; font-size:12.5px;
  width:max-content; max-width:90%; text-align:center; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(-4px);}
.foot{text-align:center; font-size:9.5px; opacity:.32; letter-spacing:.05em;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-box"><div class="hud-lab">Điểm</div><div class="hud-val" id="h-score">0</div></div>
    <div class="hud-box"><div class="hud-lab">Đã nổ</div><div class="hud-val" id="h-pops">0</div></div>
    <div class="hud-box"><div class="hud-lab">Lượt trượt</div><div class="hud-val" id="h-moves">0</div></div>
    <button id="btn-help">?</button>
  </div>

  <div id="board-wrap"><div id="board"></div><div id="toast"></div></div>

  <div id="dpad">
    <button id="d-up">▲</button>
    <button id="d-left">◀</button><button id="d-down">▼</button><button id="d-right">▶</button>
  </div>

  <div class="foot">PROTOTYPE 12 · TRƯỢT VA CHẠM (SLIDE COLLIDE) · hook test</div>
</div>

<div id="ov"><div id="ovcard"></div></div>

<script>
"use strict";
/* =========================================================================
   TRƯỢT VA CHẠM (Slide Collide) — Mahjong × Block hybrid, hook prototype
   HOOK: Không chọn quân trực tiếp - đẩy CẢ BÀN theo 1 hướng (kiểu 2048/Threes).
         2 quân CÙNG mặt va vào nhau khi trượt -> cả 2 NỔ tại chỗ va chạm.
         2 quân KHÁC mặt va vào nhau -> chỉ dừng lại sát nhau (không gộp giá trị
         như 2048 - đây là điểm khác biệt cốt lõi so với 2048 gốc).
   ========================================================================= */

/* ------------------------------ CONFIG ---------------------------------- */
const SIZE = 6;
const SUITS = ['s','c'];   // Sách (que xanh) + Văn (chấm xanh dương)
const MAX_RANK = 4;        // pool nhỏ (2 suit x rank 1-4 = 8 loại quân) để va chạm xảy ra thường xuyên
const SPAWN_PER_MOVE = 2;  // mỗi lượt trượt hợp lệ sinh thêm 2 quân mới

/* ------------------------------ STATE ------------------------------------ */
const S = { board: [], score:0, pops:0, moves:0, busy:false, over:false, sound:true, fast:false };

/* ------------------------------ AUDIO (copy quy ước từ prototype 11/14) -- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;} } return AC; }
function beep(f,d,type,vol,slide){
  if(!S.sound||S.fast) return; const a=ac(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02);
  }catch(e){}
}
const sfx={
  slide: ()=>beep(220,.05,'sine',.05,260),
  pop:   n=>beep(420*Math.pow(1.1,Math.min(n,8)),.16,'triangle',.13,900),
  spawn: ()=>beep(260,.04,'sine',.04,300),
  bad:   ()=>beep(140,.12,'square',.08,110),
  lose:  ()=>{[330,262,196,147].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth',.1),i*130));}
};

/* ------------------------------ TILE ART (copy nguyên từ prototype 11/14) */
const ROWS = {1:[1],2:[2],3:[3],4:[2,2],5:[2,1,2],6:[3,3],7:[2,3,2],8:[3,2,3],9:[3,3,3]};
function dotsSVG(n,color,round){
  const rows=ROWS[n]||[n]; const H=rows.length; let out='';
  const cellH=100/H;
  rows.forEach((cnt,ri)=>{
    const cy=cellH*ri+cellH/2;
    for(let i=0;i<cnt;i++){
      const cx=100/(cnt+1)*(i+1);
      const r=Math.min(cellH*.30, 100/(cnt+1)*.42);
      if(round) out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity=".92"/><circle cx="${cx}" cy="${cy}" r="${r*.45}" fill="#fdf6e6" opacity=".55"/>`;
      else out+=`<rect x="${cx-r*.42}" y="${cy-r*1.05}" width="${r*.84}" height="${r*2.1}" rx="${r*.42}" fill="${color}" opacity=".92"/><rect x="${cx-r*.16}" y="${cy-r*.75}" width="${r*.32}" height="${r*1.5}" fill="#fdf6e6" opacity=".45"/>`;
    }
  });
  return out;
}
function honorSVG(k){
  if(k===1) return '<rect x="20" y="12" width="60" height="76" rx="8" fill="none" stroke="#d33b2c" stroke-width="9"/><rect x="38" y="34" width="24" height="32" rx="3" fill="#d33b2c"/>';
  if(k===2) return '<path d="M50 10 L86 46 L68 46 L68 90 L32 90 L32 46 L14 46 Z" fill="#2f9e5c"/>';
  return '<rect x="18" y="12" width="64" height="76" rx="8" fill="none" stroke="#3d7fbf" stroke-width="9"/>';
}
function tileHTML(t, extraCls){
  if(!t) return '';
  let inner='', cls='tile '+t.suit+(extraCls?' '+extraCls:''), lab=t.rank;
  if(t.suit==='c') inner=dotsSVG(t.rank,'#3d7fbf',true);
  else if(t.suit==='s') inner=dotsSVG(t.rank,'#2f9e5c',false);
  else if(t.suit==='w') inner=`<text x="50" y="63" font-size="60" font-weight="800" text-anchor="middle" fill="#d33b2c" font-family="Georgia,serif">${t.rank}</text><rect x="24" y="76" width="52" height="6" rx="3" fill="#d33b2c" opacity=".8"/><rect x="30" y="15" width="40" height="5" rx="2.5" fill="#d33b2c" opacity=".55"/>`;
  else { inner=honorSVG(t.rank); lab=''; }
  return `<div class="${cls}"><span class="rk">${lab}</span><svg viewBox="0 0 100 100">${inner}</svg></div>`;
}
const T = id => ({id, suit:id[0], rank:+id.slice(1)});
function randTile(){ const su=SUITS[(Math.random()*SUITS.length)|0]; const rk=1+((Math.random()*MAX_RANK)|0); return T(su+rk); }

/* ------------------------------ BOARD OPS -------------------------------- */
function emptyBoard(n){ return Array.from({length:n},()=>Array(n).fill(null)); }
function emptyCells(){ const out=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!S.board[r][c]) out.push([r,c]); return out; }
function spawnRandom(n){
  for(let k=0;k<n;k++){
    const empties=emptyCells(); if(!empties.length) return;
    const [r,c]=empties[(Math.random()*empties.length)|0];
    S.board[r][c]=randTile();
  }
}

/** Lõi thuật toán: quét 1 dòng theo hướng di chuyển (mảng đã xếp từ mép "đầu" -> mép "cuối"),
 *  trả về {result, pops} - result là mảng cùng độ dài đã điền lại đúng vị trí trong dòng gốc.
 *  Quy tắc giống thuật resolve của 2048, NHƯNG khi 2 quân trùng id gặp nhau thì CẢ HAI BIẾN MẤT
 *  (không cộng dồn thành quân mới) - và một quân chỉ được "va" 1 lần mỗi lượt (giống giới hạn
 *  merge-1-lần của 2048, tránh domino nổ dây chuyền không kiểm soát trong 1 lần trượt). */
function resolveLine(line){
  const items = line.filter(Boolean);
  const out = [];
  const merged = []; // đánh dấu phần tử trong out đã "va" rồi, không cho va tiếp trong lượt này
  let pops = 0;
  for(const t of items){
    const last = out[out.length-1];
    if(last && last.id===t.id && !merged[out.length-1]){
      out.pop();
      merged.length = out.length;
      pops++;
    } else {
      out.push(t);
      merged[out.length-1] = false;
    }
  }
  const result = out.concat(Array(line.length-out.length).fill(null));
  return {result, pops};
}

/** Áp 1 hướng lên toàn bàn. leading=true nghĩa là dòng được đọc từ mép gần gốc mảng (trái/trên)
 *  ra xa - dùng để chuẩn hoá 4 hướng về cùng 1 hàm resolveLine(). Trả về {changed, pops}. */
function applyMove(dir){
  let changed = false, totalPops = 0;
  if(dir==='left' || dir==='right'){
    for(let r=0;r<SIZE;r++){
      let line = S.board[r].slice();
      if(dir==='right') line = line.reverse();
      const {result, pops} = resolveLine(line);
      totalPops += pops;
      const final = dir==='right' ? result.reverse() : result;
      for(let c=0;c<SIZE;c++){ if(S.board[r][c]!==final[c]){ changed=true; } S.board[r][c]=final[c]; }
    }
  } else {
    for(let c=0;c<SIZE;c++){
      let line = []; for(let r=0;r<SIZE;r++) line.push(S.board[r][c]);
      if(dir==='down') line = line.reverse();
      const {result, pops} = resolveLine(line);
      totalPops += pops;
      const final = dir==='down' ? result.reverse() : result;
      for(let r=0;r<SIZE;r++){ if(S.board[r][c]!==final[r]){ changed=true; } S.board[r][c]=final[r]; }
    }
  }
  return {changed, pops: totalPops};
}

/** Mô phỏng KHÔNG mutate - dùng để check bí nước ở cả 4 hướng. */
function wouldChange(dir){
  const saved = S.board.map(row=>row.slice());
  const {changed} = applyMove(dir);
  S.board = saved;
  return changed;
}
function hasAnyMove(){ return ['left','right','up','down'].some(wouldChange); }
function isFull(){ return S.board.every(row=>row.every(Boolean)); }

/* ------------------------------ RENDER ------------------------------------ */
const $=id=>document.getElementById(id);
const boardEl=$('board');
function cellEl(r,c){ return boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }
function cellRect(r,c){ const el=cellEl(r,c); return el ? el.getBoundingClientRect() : {left:0,top:0,width:40,height:40}; }

function renderBoard(){
  boardEl.style.gridTemplateColumns=`repeat(${SIZE},1fr)`;
  let h='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)
    h+=`<div class="cell" data-r="${r}" data-c="${c}">${tileHTML(S.board[r][c])}</div>`;
  boardEl.innerHTML=h;
}
function renderHUD(){
  $('h-score').textContent=S.score;
  $('h-pops').textContent=S.pops;
  $('h-moves').textContent=S.moves;
}
function renderAll(){ renderBoard(); renderHUD(); }

function floatTxt(x,y,txt,color){
  if(S.fast) return;
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  if(color) d.style.color=color;
  d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function sparks(x,y,color,n){
  if(S.fast) return;
  for(let i=0;i<(n||8);i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.background=color||'#e8b64c';
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=20+Math.random()*26;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
               {transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(0)`,opacity:0}],
              {duration:400+Math.random()*240, easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>s.remove(),700);
  }
}

/* ------------------------------ TURN LOGIC -------------------------------- */
async function doMove(dir){
  if(S.busy||S.over) return;
  S.busy=true;
  const before = S.board.map(row=>row.slice());
  const {changed, pops} = applyMove(dir);

  if(!changed){
    S.busy=false;
    if(!hasAnyMove() && isFull()){ lose(); }
    return;
  }

  S.moves++;
  renderBoard();
  sfx.slide();

  if(pops>0){
    S.pops += pops;
    const gain = pops*20;
    S.score += gain;
    const br = boardEl.getBoundingClientRect();
    floatTxt(br.left+br.width/2, br.top+br.height/2, '+'+gain, '#e8b64c');
    sparks(br.left+br.width/2, br.top+br.height/2, '#e8b64c', 6+pops*3);
    sfx.pop(pops);
  }
  renderHUD();

  spawnRandom(SPAWN_PER_MOVE);
  renderBoard();
  boardEl.querySelectorAll('.tile').forEach(el=>{ /* các tile mới không có class riêng để phân biệt an toàn - bỏ qua hiệu ứng chi tiết cho bản hook-test */ });

  await new Promise(r=>setTimeout(r, S.fast?0:60));
  S.busy=false;

  if(isFull() && !hasAnyMove()){ lose(); }
}

/* ------------------------------ INPUT ------------------------------------- */
$('d-up').addEventListener('click',()=>doMove('up'));
$('d-down').addEventListener('click',()=>doMove('down'));
$('d-left').addEventListener('click',()=>doMove('left'));
$('d-right').addEventListener('click',()=>doMove('right'));
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){ doMove('up'); e.preventDefault(); }
  else if(e.key==='ArrowDown'){ doMove('down'); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ doMove('left'); e.preventDefault(); }
  else if(e.key==='ArrowRight'){ doMove('right'); e.preventDefault(); }
});
let swipe=null;
boardEl.addEventListener('pointerdown',e=>{ swipe={x:e.clientX,y:e.clientY}; });
boardEl.addEventListener('pointerup',e=>{
  if(!swipe) return;
  const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  swipe=null;
  if(Math.abs(dx)<24 && Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) doMove(dx>0?'right':'left');
  else doMove(dy>0?'down':'up');
});

/* ------------------------------ FLOW / OVERLAY ---------------------------- */
function toast(msg,ms){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms||1600);
}
function overlay(html){ $('ovcard').innerHTML=html; $('ov').classList.add('on'); }
function closeOv(){ $('ov').classList.remove('on'); }

const HOOK_INTRO='Không chọn quân trực tiếp - đẩy <b class="hl">CẢ BÀN</b> theo 1 hướng. 2 quân <b class="hl">CÙNG mặt</b> va vào nhau khi trượt sẽ NỔ. 2 quân khác mặt va nhau chỉ dừng lại sát cạnh (không cộng dồn như 2048).';

function introOverlay(){
  overlay(`<h2>Trượt Va Chạm</h2>
   <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
   <p>${HOOK_INTRO}</p>
   <div class="demo">${tileHTML(T('s2'))}<span class="arw">→ ←</span>${tileHTML(T('s2'))}<span class="arw">=</span><b style="color:var(--jade)">NỔ</b></div>
   <ul>
    <li>Vuốt trên bàn, bấm nút hướng, hoặc dùng phím mũi tên để trượt cả bàn theo 1 hướng.</li>
    <li>Mọi quân trượt hết cỡ tới khi chạm biên hoặc chạm quân khác.</li>
    <li>Sau mỗi lượt trượt hợp lệ, có thêm quân mới mọc ngẫu nhiên.</li>
    <li><b class="dg">Thua</b> khi bàn gần kín và không hướng nào còn tạo được chuyển động hay va chạm.</li>
   </ul>
   <button class="btn" onclick="__go()">CHƠI</button>`);
}
window.__go=()=>{ closeOv(); ac(); };

const HELP=`<h2>Trượt Va Chạm</h2>
 <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
 <p>${HOOK_INTRO}</p>
 <ul>
  <li>4 hướng trượt: vuốt / nút / phím mũi tên. Cả bàn di chuyển cùng lúc mỗi lượt.</li>
  <li>Quân cùng mặt va nhau -> cả 2 biến mất, +điểm. Quân khác mặt va nhau -> chỉ chặn đường đi.</li>
  <li>Một quân chỉ được va 1 lần mỗi lượt trượt (giống luật merge-1-lần của 2048).</li>
  <li><b class="dg">Thua</b>: bàn đầy kín và mô phỏng cả 4 hướng đều không còn thay đổi gì (bí nước thật).</li>
 </ul>
 <button class="btn" onclick="__closehelp()">ĐÓNG</button>`;
window.__closehelp=()=>{ closeOv(); };
$('btn-help').addEventListener('click',()=>overlay(HELP));

function lose(){
  S.over=true; sfx.lose();
  overlay(`<h2 style="color:var(--danger)">BÍ NƯỚC</h2>
   <div class="sub">Điểm: <b class="hl">${S.score}</b> · đã nổ ${S.pops} quân · ${S.moves} lượt trượt</div>
   <p>Bàn đã đầy kín và không còn hướng trượt nào tạo ra chuyển động hay va chạm.</p>
   <button class="btn" onclick="__restart()">CHƠI LẠI</button>`);
}
window.__restart=()=>{ closeOv(); startGame(); };

function startGame(){
  S.board=emptyBoard(SIZE); S.score=0; S.pops=0; S.moves=0; S.busy=false; S.over=false;
  spawnRandom(10);
  renderAll();
}
window.addEventListener('resize',()=>{ if(!S.busy) renderAll(); });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#app')) e.preventDefault(); });

/* ------------------------------ TEST HOOK / SELFTEST ---------------------- */
window.__digest={ S, T, resolveLine, applyMove, hasAnyMove, isFull, startGame,
  state:()=>({score:S.score,pops:S.pops,moves:S.moves,over:S.over}) };
(function selftest(){
  const out=[];
  const r1=resolveLine([T('s1'),T('s1'),null,T('s2')]);
  out.push(['match-collide-removes-both', r1.result.filter(Boolean).length===1 && r1.pops===1]);
  const r2=resolveLine([T('s1'),T('s2'),T('s3')]);
  out.push(['no-match-just-compacts', r2.result.filter(Boolean).length===3 && r2.pops===0]);
  const r3=resolveLine([T('s1'),T('s1'),T('s1')]);
  out.push(['merge-once-per-move', r3.pops===1 && r3.result.filter(Boolean).length===1]);
  const savedBoard=S.board.map(row=>row.slice());
  S.board=emptyBoard(SIZE);
  S.board[0]=[T('s1'),null,null,null,null,T('s1')];
  const before=S.board.map(row=>row.slice());
  const {changed}=applyMove('left');
  out.push(['apply-move-mutates-and-collides', changed===true && S.board[0][0]===null && S.board[0][1]===null]);
  S.board=savedBoard;
  const bad=out.filter(x=>!x[1]);
  console.log('[selftest]', bad.length? 'FAIL '+JSON.stringify(bad) : 'OK ('+out.length+' checks)');
})();

startGame();
introOverlay();
</script>
