<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cột Chồng — Mahjong × Block (prototype 13)</title>
<style>
:root{
  --wood:#2b1d16; --wood2:#3d2a20; --felt:#14342b; --felt2:#0d241d;
  --cream:#f6ecd8; --cream2:#e6d7ba; --ink:#2a2018;
  --gold:#e8b64c; --jade:#4ec98a; --danger:#ff5d51; --blue:#4a9fe0; --red:#e0553f; --green:#3fae6a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #5a3d2c 0%, var(--wood) 55%, #1b120d 100%);
  color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none; touch-action:manipulation; user-select:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:8px; padding:8px 10px 12px;}

#hud{display:flex; align-items:center; gap:8px;}
.hud-box{flex:1; background:rgba(0,0,0,.28); border:1px solid rgba(232,182,76,.22); border-radius:10px; padding:5px 8px;}
.hud-lab{font-size:9px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;}
.hud-val{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15;}
#btn-help{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(232,182,76,.22);color:var(--cream);font-size:15px;font-weight:700;}

/* ---------- QUEUE (quân sắp rơi) ---------- */
#queue-wrap{display:flex; align-items:center; justify-content:center; gap:10px;
  background:rgba(0,0,0,.24); border:1px solid rgba(232,182,76,.2); border-radius:12px; padding:7px 10px;}
.q-lab{font-size:9px; letter-spacing:.1em; text-transform:uppercase; opacity:.6;}
#q-pending{width:46px;height:58px;}
#q-next{width:30px;height:38px; opacity:.65;}
.q-arrow{opacity:.5; font-size:14px;}

/* ---------- COLUMNS ---------- */
#board-wrap{position:relative; width:100%; display:flex; justify-content:center;}
#board{
  width:min(100%, 78vw); flex:none; position:relative;
  display:flex; gap:5px; padding:6px; border-radius:14px;
  background:linear-gradient(160deg,var(--felt),var(--felt2));
  border:1px solid rgba(232,182,76,.22);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}
.col{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0;}
.slot{aspect-ratio:.82; border-radius:6px; background:rgba(0,0,0,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.035); position:relative;}
.slot.empty.dropok{background:rgba(232,182,76,.14); box-shadow:inset 0 0 0 2px rgba(232,182,76,.55);}
.slot.full{cursor:default;}
.slot .tile{position:absolute; inset:0;}
.slot.top .tile{box-shadow:0 0 0 2px rgba(232,182,76,.5);}
.slot.top.selA .tile{box-shadow:0 0 0 2.5px var(--gold);}
.slot.top.matchYes .tile{box-shadow:0 0 0 2.5px var(--jade);}
.slot.top.matchNo .tile{box-shadow:0 0 0 2.5px var(--danger);}
.slot .tile.pop{animation:pop .22s ease-out forwards;}
@keyframes pop{0%{transform:scale(1); opacity:1}50%{transform:scale(1.3); filter:brightness(2)}100%{transform:scale(0); opacity:0}}
.slot .tile.drop{animation:dropin .18s cubic-bezier(.3,1.4,.5,1);}
@keyframes dropin{0%{transform:translateY(-140%); opacity:.4}100%{transform:translateY(0); opacity:1}}
.col.colfull{opacity:.55;}
.col-cap{text-align:center; font-size:9px; opacity:.55; margin-top:2px;}

/* ---------- TILE ART (copy nguyên quy ước từ prototype 11/14) ---------- */
.tile{border-radius:6px; background:linear-gradient(170deg,#fdf6e6 0%,var(--cream) 40%,var(--cream2) 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16), inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.tile svg{width:88%; height:88%; display:block;}
.tile .rk{position:absolute; top:1px; left:2.5px; font-size:8px; font-weight:800; line-height:1; opacity:.62;}
.tile.s .rk{color:var(--green)} .tile.c .rk{color:var(--blue)} .tile.w .rk{color:var(--red)} .tile.h .rk{color:#b3862a}

.float{position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:16px; color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,.8); animation:floatup 1s ease-out forwards;}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7); opacity:0}25%{transform:translate(-50%,-12px) scale(1.15); opacity:1}100%{transform:translate(-50%,-46px) scale(1); opacity:0}}
.spark{position:fixed; z-index:75; width:6px; height:6px; border-radius:50%; pointer-events:none;}

#ov{position:fixed; inset:0; z-index:100; background:rgba(12,8,6,.86); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:18px;}
#ov.on{display:flex;}
#ovcard{width:100%; max-width:360px; background:linear-gradient(170deg,#3d2a20,#241812); border:1px solid rgba(232,182,76,.35);
  border-radius:16px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.6); max-height:86vh; overflow:auto;}
#ovcard h2{margin:0 0 4px; font-size:20px; color:var(--gold);}
#ovcard .sub{font-size:12px; opacity:.7; margin-bottom:12px;}
#ovcard p{font-size:13px; line-height:1.55; margin:0 0 9px;}
#ovcard ul{font-size:12.5px; line-height:1.6; padding-left:17px; margin:0 0 10px;}
#ovcard .hl{color:var(--gold); font-weight:700;}
#ovcard .dg{color:var(--danger); font-weight:700;}
.btn{width:100%; padding:12px; border-radius:11px; border:0; font-size:14px; font-weight:800;
  background:linear-gradient(180deg,var(--gold),#c8912e); color:#2a1d0b; margin-top:6px;}
.demo{display:flex; gap:4px; justify-content:center; align-items:center; margin:8px 0 12px;}
.demo .tile{width:30px;height:38px;}
.demo .arw{opacity:.6; font-size:15px; padding:0 3px;}
#toast{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); z-index:90; background:rgba(20,14,10,.95);
  border:1px solid rgba(232,182,76,.4); color:var(--cream); padding:9px 14px; border-radius:10px; font-size:12.5px;
  width:max-content; max-width:90%; text-align:center; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(-4px);}
.foot{text-align:center; font-size:9.5px; opacity:.32; letter-spacing:.05em;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-box"><div class="hud-lab">Điểm</div><div class="hud-val" id="h-score">0</div></div>
    <div class="hud-box"><div class="hud-lab">Đã nổ</div><div class="hud-val" id="h-pops">0</div></div>
    <button id="btn-help">?</button>
  </div>

  <div id="queue-wrap">
    <div><div class="q-lab">SẮP RƠI</div><div id="q-pending"></div></div>
    <div class="q-arrow">→</div>
    <div><div class="q-lab">kế tiếp</div><div id="q-next"></div></div>
  </div>

  <div id="board-wrap"><div id="board"></div><div id="toast"></div></div>

  <div class="foot">PROTOTYPE 13 · CỘT CHỒNG (STACK COLUMNS) · hook test</div>
</div>

<div id="ov"><div id="ovcard"></div></div>

<script>
"use strict";
/* =========================================================================
   CỘT CHỒNG (Stack Columns) — Mahjong × Block hybrid, hook prototype
   HOOK: Quân chỉ "lộ" khi nằm trên ĐỈNH cột (kiểu Connect-4/Puyo).
         Bấm cột trống để THẢ quân đang chờ vào đó. Bấm 2 ĐỈNH cột khác nhau
         cùng mặt để NỔ. Cột nào đầy kín mà không còn cột nào nhận được quân
         mới nữa thì thua.
   ========================================================================= */

/* ------------------------------ CONFIG ---------------------------------- */
const COLS = 5;
const MAX_HEIGHT = 7;
const SUITS = ['s','c'];
const MAX_RANK = 5;

/* ------------------------------ STATE ------------------------------------ */
const S = { columns:[], pending:null, next:null, score:0, pops:0, sel:null, busy:false, over:false, sound:true, fast:false };

/* ------------------------------ AUDIO (copy quy ước từ prototype 11/14) -- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;} } return AC; }
function beep(f,d,type,vol,slide){
  if(!S.sound||S.fast) return; const a=ac(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02);
  }catch(e){}
}
const sfx={
  drop: ()=>beep(240,.06,'sine',.06,180),
  pop:  n=>beep(420*Math.pow(1.1,Math.min(n,8)),.16,'triangle',.13,900),
  bad:  ()=>beep(140,.12,'square',.08,110),
  lose: ()=>{[330,262,196,147].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth',.1),i*130));}
};

/* ------------------------------ TILE ART (copy nguyên từ prototype 11/14) */
const ROWS = {1:[1],2:[2],3:[3],4:[2,2],5:[2,1,2],6:[3,3],7:[2,3,2],8:[3,2,3],9:[3,3,3]};
function dotsSVG(n,color,round){
  const rows=ROWS[n]||[n]; const H=rows.length; let out='';
  const cellH=100/H;
  rows.forEach((cnt,ri)=>{
    const cy=cellH*ri+cellH/2;
    for(let i=0;i<cnt;i++){
      const cx=100/(cnt+1)*(i+1);
      const r=Math.min(cellH*.30, 100/(cnt+1)*.42);
      if(round) out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity=".92"/><circle cx="${cx}" cy="${cy}" r="${r*.45}" fill="#fdf6e6" opacity=".55"/>`;
      else out+=`<rect x="${cx-r*.42}" y="${cy-r*1.05}" width="${r*.84}" height="${r*2.1}" rx="${r*.42}" fill="${color}" opacity=".92"/><rect x="${cx-r*.16}" y="${cy-r*.75}" width="${r*.32}" height="${r*1.5}" fill="#fdf6e6" opacity=".45"/>`;
    }
  });
  return out;
}
function honorSVG(k){
  if(k===1) return '<rect x="20" y="12" width="60" height="76" rx="8" fill="none" stroke="#d33b2c" stroke-width="9"/><rect x="38" y="34" width="24" height="32" rx="3" fill="#d33b2c"/>';
  if(k===2) return '<path d="M50 10 L86 46 L68 46 L68 90 L32 90 L32 46 L14 46 Z" fill="#2f9e5c"/>';
  return '<rect x="18" y="12" width="64" height="76" rx="8" fill="none" stroke="#3d7fbf" stroke-width="9"/>';
}
function tileHTML(t, extraCls){
  if(!t) return '';
  let inner='', cls='tile '+t.suit+(extraCls?' '+extraCls:''), lab=t.rank;
  if(t.suit==='c') inner=dotsSVG(t.rank,'#3d7fbf',true);
  else if(t.suit==='s') inner=dotsSVG(t.rank,'#2f9e5c',false);
  else if(t.suit==='w') inner=`<text x="50" y="63" font-size="60" font-weight="800" text-anchor="middle" fill="#d33b2c" font-family="Georgia,serif">${t.rank}</text><rect x="24" y="76" width="52" height="6" rx="3" fill="#d33b2c" opacity=".8"/><rect x="30" y="15" width="40" height="5" rx="2.5" fill="#d33b2c" opacity=".55"/>`;
  else { inner=honorSVG(t.rank); lab=''; }
  return `<div class="${cls}"><span class="rk">${lab}</span><svg viewBox="0 0 100 100">${inner}</svg></div>`;
}
const T = id => ({id, suit:id[0], rank:+id.slice(1)});
function randTile(){ const su=SUITS[(Math.random()*SUITS.length)|0]; const rk=1+((Math.random()*MAX_RANK)|0); return T(su+rk); }

/* ------------------------------ COLUMN OPS -------------------------------- */
function colFull(i){ return S.columns[i].length>=MAX_HEIGHT; }
function allFull(){ return S.columns.every((_,i)=>colFull(i)); }
function topTile(i){ const col=S.columns[i]; return col.length? col[col.length-1] : null; }

/* ------------------------------ RENDER ------------------------------------ */
const $=id=>document.getElementById(id);
const boardEl=$('board');

function slotEl(i,visualRow){ return boardEl.querySelector(`.col[data-i="${i}"] .slot[data-row="${visualRow}"]`); }
function topSlotEl(i){ const emptyRows=MAX_HEIGHT-S.columns[i].length; return slotEl(i, emptyRows); }

function renderBoard(){
  let h='';
  for(let i=0;i<COLS;i++){
    const col=S.columns[i];
    const emptyRows=MAX_HEIGHT-col.length;
    let rowsHtml='';
    for(let row=0;row<MAX_HEIGHT;row++){
      if(row<emptyRows){
        rowsHtml+=`<div class="slot empty" data-row="${row}"></div>`;
      } else {
        const stackIdx = MAX_HEIGHT-1-row;
        const isTop = row===emptyRows;
        rowsHtml+=`<div class="slot full${isTop?' top':''}" data-row="${row}">${tileHTML(col[stackIdx])}</div>`;
      }
    }
    h+=`<div class="col${colFull(i)?' colfull':''}" data-i="${i}">${rowsHtml}<div class="col-cap">${col.length}/${MAX_HEIGHT}</div></div>`;
  }
  boardEl.innerHTML=h;
}
function renderQueue(){
  $('q-pending').innerHTML = tileHTML(S.pending);
  $('q-next').innerHTML = tileHTML(S.next);
}
function renderHUD(){ $('h-score').textContent=S.score; $('h-pops').textContent=S.pops; }
function renderAll(){ renderBoard(); renderQueue(); renderHUD(); }

function floatTxt(x,y,txt,color){
  if(S.fast) return;
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  if(color) d.style.color=color;
  d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function sparks(x,y,color,n){
  if(S.fast) return;
  for(let i=0;i<(n||8);i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.background=color||'#e8b64c';
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=20+Math.random()*26;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
               {transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(0)`,opacity:0}],
              {duration:400+Math.random()*240, easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>s.remove(),700);
  }
}

/* ------------------------------ SELECTION --------------------------------- */
function clearSelection(){
  S.sel=null;
  boardEl.querySelectorAll('.slot.top').forEach(e=>e.classList.remove('selA','matchYes','matchNo'));
}
function selectTop(i){
  clearSelection();
  if(!topTile(i)) return;
  S.sel=i;
  const el=topSlotEl(i); if(el) el.classList.add('selA');
}
function toast(msg,ms){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms||1600);
}

/* ------------------------------ ACTIONS ------------------------------------ */
async function dropInto(i){
  if(S.busy||S.over) return;
  if(colFull(i)){ toast('Cột đã đầy'); return; }
  S.busy=true; clearSelection();
  const tile=S.pending;
  S.columns[i].push(tile);
  S.pending=S.next; S.next=randTile();
  renderBoard(); renderQueue();
  const el=topSlotEl(i), tl=el&&el.querySelector('.tile');
  if(tl) tl.classList.add('drop');
  sfx.drop();
  await new Promise(r=>setTimeout(r, S.fast?0:120));
  S.busy=false;

  if(allFull()){ lose(); }
}

async function tryMatch(i,j){
  if(S.busy||S.over) return;
  const a=topTile(i), b=topTile(j);
  if(!a||!b) return;
  if(a.id!==b.id){
    const el=topSlotEl(j); if(el) el.classList.add('matchNo');
    sfx.bad(); toast('Không cùng mặt — không nổ được');
    setTimeout(clearSelection,260);
    return;
  }
  S.busy=true;
  const elA=topSlotEl(i), elB=topSlotEl(j);
  const tlA=elA&&elA.querySelector('.tile'), tlB=elB&&elB.querySelector('.tile');
  if(tlA) tlA.classList.add('pop'); if(tlB) tlB.classList.add('pop');
  const rectA=elA?elA.getBoundingClientRect():{left:0,top:0,width:0,height:0};
  sfx.pop(1);
  await new Promise(r=>setTimeout(r, S.fast?0:220));

  S.columns[i].pop(); S.columns[j].pop();
  S.pops++; S.score+=30;
  clearSelection();
  renderBoard(); renderHUD();
  floatTxt(rectA.left+rectA.width/2, rectA.top, '+30', '#e8b64c');
  sparks(rectA.left+rectA.width/2, rectA.top+rectA.height/2, '#e8b64c', 10);
  S.busy=false;
}

function handleTapTop(i){
  if(S.busy||S.over) return;
  if(S.sel===null){ selectTop(i); return; }
  if(S.sel===i){ clearSelection(); return; }
  const a=topTile(S.sel), b=topTile(i);
  if(a && b && a.id===b.id){
    const elJ=topSlotEl(i); if(elJ) elJ.classList.add('matchYes');
    tryMatch(S.sel,i);
  } else {
    tryMatch(S.sel,i);
  }
}

boardEl.addEventListener('click',e=>{
  const slot=e.target.closest('.slot'); if(!slot) return;
  const colEl=slot.closest('.col'); const i=+colEl.dataset.i;
  if(slot.classList.contains('top')){ handleTapTop(i); }
  else if(slot.classList.contains('empty')){ clearSelection(); dropInto(i); }
});

/* ------------------------------ FLOW / OVERLAY ---------------------------- */
function overlay(html){ $('ovcard').innerHTML=html; $('ov').classList.add('on'); }
function closeOv(){ $('ov').classList.remove('on'); }

const HOOK_INTRO='Quân chỉ "lộ" khi nó nằm trên <b class="hl">ĐỈNH cột</b>. Bấm vào phần trống của 1 cột để <b class="hl">thả</b> quân đang chờ vào đó, và bấm 2 đỉnh cột KHÁC NHAU cùng mặt để <b class="hl">nổ</b> — đừng để cột nào tràn.';

function introOverlay(){
  overlay(`<h2>Cột Chồng</h2>
   <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
   <p>${HOOK_INTRO}</p>
   <div class="demo">${tileHTML(T('s2'))}<span class="arw">···</span>${tileHTML(T('s2'))}<span class="arw">=</span><b style="color:var(--jade)">NỔ</b></div>
   <ul>
    <li>Bấm phần trống phía trên 1 cột để thả quân "sắp rơi" vào cột đó.</li>
    <li>Bấm đỉnh 1 cột để chọn, rồi bấm đỉnh cột khác cùng mặt để nổ cả 2.</li>
    <li>Quân bị chôn dưới đáy không match được — phải nổ hết quân trên đỉnh trước.</li>
    <li><b class="dg">Thua</b> khi mọi cột đều đầy kín, không còn chỗ cho quân sắp rơi.</li>
   </ul>
   <button class="btn" onclick="__go()">CHƠI</button>`);
}
window.__go=()=>{ closeOv(); ac(); };

const HELP=`<h2>Cột Chồng</h2>
 <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
 <p>${HOOK_INTRO}</p>
 <ul>
  <li>Khu "SẮP RƠI" hiện quân bạn sắp thả; "kế tiếp" là quân sau đó để lên kế hoạch.</li>
  <li>Chỉ đỉnh cột mới lộ và match được — chọn đúng cột để chồng quân cho hợp lý.</li>
  <li><b class="dg">Thua</b>: tất cả cột đều đạt chiều cao tối đa (${MAX_HEIGHT}) cùng lúc.</li>
 </ul>
 <button class="btn" onclick="__closehelp()">ĐÓNG</button>`;
window.__closehelp=()=>{ closeOv(); };
$('btn-help').addEventListener('click',()=>overlay(HELP));

function lose(){
  S.over=true; sfx.lose();
  overlay(`<h2 style="color:var(--danger)">CỘT TRÀN</h2>
   <div class="sub">Điểm: <b class="hl">${S.score}</b> · đã nổ ${S.pops} cặp</div>
   <p>Mọi cột đều đã đầy kín (${MAX_HEIGHT} quân) — không còn chỗ cho quân mới.</p>
   <button class="btn" onclick="__restart()">CHƠI LẠI</button>`);
}
window.__restart=()=>{ closeOv(); startGame(); };

function startGame(){
  S.columns=Array.from({length:COLS},()=>[]);
  S.score=0; S.pops=0; S.sel=null; S.busy=false; S.over=false;
  // seed vài quân đáy cột để bàn không quá trống lúc bắt đầu
  for(let i=0;i<COLS;i++){
    const seedN=1+((Math.random()*2)|0);
    for(let k=0;k<seedN;k++) S.columns[i].push(randTile());
  }
  S.pending=randTile(); S.next=randTile();
  renderAll();
}
window.addEventListener('resize',()=>{ if(!S.busy) renderAll(); });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#app')) e.preventDefault(); });

/* ------------------------------ TEST HOOK / SELFTEST ---------------------- */
window.__digest={ S, T, topTile, colFull, allFull, startGame,
  state:()=>({score:S.score,pops:S.pops,cols:S.columns.map(c=>c.length),over:S.over}) };
(function selftest(){
  const out=[];
  S.columns=Array.from({length:COLS},()=>[]);
  S.columns[0]=[T('s1'),T('s2')];
  S.columns[1]=[T('c1'),T('s2')];
  out.push(['topTile-reads-last', topTile(0).id==='s2']);
  out.push(['colFull-false-when-short', colFull(0)===false]);
  for(let k=0;k<MAX_HEIGHT;k++) S.columns[2].push(T('s1'));
  out.push(['colFull-true-at-max', colFull(2)===true]);
  out.push(['allFull-false-mixed', allFull()===false]);
  const bad=out.filter(x=>!x[1]);
  console.log('[selftest]', bad.length? 'FAIL '+JSON.stringify(bad) : 'OK ('+out.length+' checks)');
})();

startGame();
introOverlay();
</script>
