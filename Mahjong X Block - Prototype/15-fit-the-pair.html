<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Domino Ghép Hình — Mahjong × Block (prototype 15)</title>
<style>
:root{
  --wood:#2b1d16; --wood2:#3d2a20; --felt:#14342b; --felt2:#0d241d;
  --cream:#f6ecd8; --cream2:#e6d7ba; --ink:#2a2018;
  --gold:#e8b64c; --jade:#4ec98a; --danger:#ff5d51; --blue:#4a9fe0; --red:#e0553f; --green:#3fae6a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    radial-gradient(120% 80% at 50% -10%, #5a3d2c 0%, var(--wood) 55%, #1b120d 100%);
  color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none; touch-action:manipulation; user-select:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
#app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:8px; padding:8px 10px 12px;}

#hud{display:flex; align-items:center; gap:8px;}
.hud-box{flex:1; background:rgba(0,0,0,.28); border:1px solid rgba(232,182,76,.22); border-radius:10px; padding:5px 8px;}
.hud-lab{font-size:9px; letter-spacing:.12em; text-transform:uppercase; opacity:.55;}
.hud-val{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15;}
#btn-help{width:34px;height:34px;flex:none;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(232,182,76,.22);color:var(--cream);font-size:15px;font-weight:700;}

#board-wrap{position:relative; width:100%; display:flex; justify-content:center;}
#board{
  width:min(100%, 68vh); flex:none; position:relative;
  display:grid; gap:3px; padding:6px; border-radius:14px;
  background:linear-gradient(160deg,var(--felt),var(--felt2));
  border:1px solid rgba(232,182,76,.22);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}
.cell{aspect-ratio:1; border-radius:6px; background:rgba(0,0,0,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.035); position:relative;}
.cell.ghost{background:rgba(232,182,76,.2); box-shadow:inset 0 0 0 2px rgba(232,182,76,.75);}
.cell.ghostbad{background:rgba(255,93,81,.2); box-shadow:inset 0 0 0 2px rgba(255,93,81,.8);}
.cell .tile{position:absolute; inset:0;}
.cell .tile.pop{animation:pop .22s ease-out forwards;}
@keyframes pop{0%{transform:scale(1); opacity:1}50%{transform:scale(1.3); filter:brightness(2)}100%{transform:scale(0); opacity:0}}
.cell .tile.drop{animation:dropin .18s cubic-bezier(.3,1.4,.5,1);}
@keyframes dropin{0%{transform:scale(.5); opacity:.3}100%{transform:scale(1); opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}
.cell.shakebad{animation:shake .3s;}

/* ---------- TILE ART (copy nguyên quy ước từ prototype 11/14) ---------- */
.tile{border-radius:6px; background:linear-gradient(170deg,#fdf6e6 0%,var(--cream) 40%,var(--cream2) 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.16), inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;}
.tile svg{width:88%; height:88%; display:block;}
.tile .rk{position:absolute; top:1px; left:2.5px; font-size:8px; font-weight:800; line-height:1; opacity:.62;}
.tile.s .rk{color:var(--green)} .tile.c .rk{color:var(--blue)} .tile.w .rk{color:var(--red)} .tile.h .rk{color:#b3862a}

/* ---------- PIECE TRAY (domino hiện tại + kế tiếp + xoay) ---------- */
#tray-wrap{background:rgba(0,0,0,.24); border:1px solid rgba(232,182,76,.18); border-radius:14px; padding:9px; display:flex; align-items:center; gap:12px; justify-content:center;}
.piece-lab{font-size:9px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; text-align:center; margin-bottom:4px;}
#p-current{display:flex; gap:3px;}
#p-current.vert{flex-direction:column;}
#p-current .tile{width:38px;height:48px;}
#p-current.vert .tile{width:38px;height:38px;}
#p-next{display:flex; gap:2px; opacity:.6;}
#p-next .tile{width:22px;height:28px;}
#btn-rotate{border-radius:10px; border:1px solid rgba(232,182,76,.3); background:rgba(0,0,0,.3); color:var(--cream); font-size:20px; width:44px; height:44px;}
#btn-rotate:active{background:rgba(232,182,76,.25);}

.float{position:fixed; z-index:80; pointer-events:none; font-weight:900; font-size:16px; color:var(--gold);
  text-shadow:0 2px 6px rgba(0,0,0,.8); animation:floatup 1s ease-out forwards;}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.7); opacity:0}25%{transform:translate(-50%,-12px) scale(1.15); opacity:1}100%{transform:translate(-50%,-46px) scale(1); opacity:0}}
.spark{position:fixed; z-index:75; width:6px; height:6px; border-radius:50%; pointer-events:none;}

#ov{position:fixed; inset:0; z-index:100; background:rgba(12,8,6,.86); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:18px;}
#ov.on{display:flex;}
#ovcard{width:100%; max-width:360px; background:linear-gradient(170deg,#3d2a20,#241812); border:1px solid rgba(232,182,76,.35);
  border-radius:16px; padding:18px; box-shadow:0 20px 50px rgba(0,0,0,.6); max-height:86vh; overflow:auto;}
#ovcard h2{margin:0 0 4px; font-size:20px; color:var(--gold);}
#ovcard .sub{font-size:12px; opacity:.7; margin-bottom:12px;}
#ovcard p{font-size:13px; line-height:1.55; margin:0 0 9px;}
#ovcard ul{font-size:12.5px; line-height:1.6; padding-left:17px; margin:0 0 10px;}
#ovcard .hl{color:var(--gold); font-weight:700;}
#ovcard .dg{color:var(--danger); font-weight:700;}
.btn{width:100%; padding:12px; border-radius:11px; border:0; font-size:14px; font-weight:800;
  background:linear-gradient(180deg,var(--gold),#c8912e); color:#2a1d0b; margin-top:6px;}
.demo{display:flex; gap:4px; justify-content:center; align-items:center; margin:8px 0 12px;}
.demo .tile{width:30px;height:38px;}
.demo .arw{opacity:.6; font-size:15px; padding:0 3px;}
#toast{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:90; background:rgba(20,14,10,.95);
  border:1px solid rgba(232,182,76,.4); color:var(--cream); padding:9px 14px; border-radius:10px; font-size:12.5px;
  width:max-content; max-width:90%; text-align:center; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;}
#toast.on{opacity:1; transform:translateX(-50%) translateY(-4px);}
.foot{text-align:center; font-size:9.5px; opacity:.32; letter-spacing:.05em;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hud-box"><div class="hud-lab">Điểm</div><div class="hud-val" id="h-score">0</div></div>
    <div class="hud-box"><div class="hud-lab">Đã nổ</div><div class="hud-val" id="h-pops">0</div></div>
    <div class="hud-box"><div class="hud-lab">Đã đặt</div><div class="hud-val" id="h-placed">0</div></div>
    <button id="btn-help">?</button>
  </div>

  <div id="board-wrap"><div id="board"></div><div id="toast"></div></div>

  <div id="tray-wrap">
    <div><div class="piece-lab">DOMINO HIỆN TẠI<br>(bấm ô để đặt)</div><div id="p-current"></div></div>
    <button id="btn-rotate">⟳</button>
    <div><div class="piece-lab">kế tiếp</div><div id="p-next"></div></div>
  </div>

  <div class="foot">PROTOTYPE 15 · DOMINO GHÉP HÌNH (FIT THE PAIR) · hook test</div>
</div>

<div id="ov"><div id="ovcard"></div></div>

<script>
"use strict";
/* =========================================================================
   DOMINO GHÉP HÌNH (Fit the Pair) — Mahjong × Block hybrid, hook prototype
   HOOK: Đặt khối CHÍNH LÀ hành động match. Khối là 1 domino 2 ô, mỗi nửa
         mang 1 quân mahjong độc lập. Domino tự nổ nếu 2 nửa trùng nhau;
         nếu không, mỗi nửa nổ theo cặp với 1 láng giềng đã có sẵn cùng mặt.
         Domino không nổ thì nằm lại vĩnh viễn, lấp dần bàn -> bí là thua.
   ========================================================================= */

/* ------------------------------ CONFIG ---------------------------------- */
const SIZE = 8;
const SUITS = ['s','c'];
const MAX_RANK = 6;

/* ------------------------------ STATE ------------------------------------ */
const S = {
  board: [], current:null, next:null, orient:'H',
  score:0, pops:0, placed:0, busy:false, over:false, sound:true, fast:false
};

/* ------------------------------ AUDIO (copy quy ước từ prototype 11/14) -- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=false;} } return AC; }
function beep(f,d,type,vol,slide){
  if(!S.sound||S.fast) return; const a=ac(); if(!a) return;
  try{
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
    g.gain.setValueAtTime(0,a.currentTime);
    g.gain.linearRampToValueAtTime(vol||.12,a.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0008,a.currentTime+d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d+.02);
  }catch(e){}
}
const sfx={
  place: ()=>beep(320,.07,'triangle',.09,420),
  pop:   n=>beep(420*Math.pow(1.1,Math.min(n,8)),.16,'triangle',.13,900),
  bad:   ()=>beep(140,.12,'square',.08,110),
  rotate:()=>beep(500,.05,'sine',.06,700),
  lose:  ()=>{[330,262,196,147].forEach((f,i)=>setTimeout(()=>beep(f,.3,'sawtooth',.1),i*130));}
};

/* ------------------------------ TILE ART (copy nguyên từ prototype 11/14) */
const ROWS = {1:[1],2:[2],3:[3],4:[2,2],5:[2,1,2],6:[3,3],7:[2,3,2],8:[3,2,3],9:[3,3,3]};
function dotsSVG(n,color,round){
  const rows=ROWS[n]||[n]; const H=rows.length; let out='';
  const cellH=100/H;
  rows.forEach((cnt,ri)=>{
    const cy=cellH*ri+cellH/2;
    for(let i=0;i<cnt;i++){
      const cx=100/(cnt+1)*(i+1);
      const r=Math.min(cellH*.30, 100/(cnt+1)*.42);
      if(round) out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}" opacity=".92"/><circle cx="${cx}" cy="${cy}" r="${r*.45}" fill="#fdf6e6" opacity=".55"/>`;
      else out+=`<rect x="${cx-r*.42}" y="${cy-r*1.05}" width="${r*.84}" height="${r*2.1}" rx="${r*.42}" fill="${color}" opacity=".92"/><rect x="${cx-r*.16}" y="${cy-r*.75}" width="${r*.32}" height="${r*1.5}" fill="#fdf6e6" opacity=".45"/>`;
    }
  });
  return out;
}
function honorSVG(k){
  if(k===1) return '<rect x="20" y="12" width="60" height="76" rx="8" fill="none" stroke="#d33b2c" stroke-width="9"/><rect x="38" y="34" width="24" height="32" rx="3" fill="#d33b2c"/>';
  if(k===2) return '<path d="M50 10 L86 46 L68 46 L68 90 L32 90 L32 46 L14 46 Z" fill="#2f9e5c"/>';
  return '<rect x="18" y="12" width="64" height="76" rx="8" fill="none" stroke="#3d7fbf" stroke-width="9"/>';
}
function tileHTML(t, extraCls){
  if(!t) return '';
  let inner='', cls='tile '+t.suit+(extraCls?' '+extraCls:''), lab=t.rank;
  if(t.suit==='c') inner=dotsSVG(t.rank,'#3d7fbf',true);
  else if(t.suit==='s') inner=dotsSVG(t.rank,'#2f9e5c',false);
  else if(t.suit==='w') inner=`<text x="50" y="63" font-size="60" font-weight="800" text-anchor="middle" fill="#d33b2c" font-family="Georgia,serif">${t.rank}</text><rect x="24" y="76" width="52" height="6" rx="3" fill="#d33b2c" opacity=".8"/><rect x="30" y="15" width="40" height="5" rx="2.5" fill="#d33b2c" opacity=".55"/>`;
  else { inner=honorSVG(t.rank); lab=''; }
  return `<div class="${cls}"><span class="rk">${lab}</span><svg viewBox="0 0 100 100">${inner}</svg></div>`;
}
const T = id => ({id, suit:id[0], rank:+id.slice(1)});
function randTile(){ const su=SUITS[(Math.random()*SUITS.length)|0]; const rk=1+((Math.random()*MAX_RANK)|0); return T(su+rk); }
function randDomino(){ return { tiles:[randTile(), randTile()] }; }

/* ------------------------------ BOARD OPS -------------------------------- */
function emptyBoard(n){ return Array.from({length:n},()=>Array(n).fill(null)); }
function inBounds(r,c){ return r>=0&&c>=0&&r<SIZE&&c<SIZE; }
function neighbors(r,c){
  return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([rr,cc])=>inBounds(rr,cc));
}
/** 2 ô mục tiêu của domino khi đặt neo tại (r,c) theo hướng orient ('H' = ngang, 'V' = dọc). */
function targetCells(r,c,orient){
  return orient==='H' ? [[r,c],[r,c+1]] : [[r,c],[r+1,c]];
}
function canPlaceAt(r,c,orient){
  const cells=targetCells(r,c,orient);
  return cells.every(([rr,cc])=> inBounds(rr,cc) && !S.board[rr][cc]);
}
/** Quét TOÀN BÀN cả 2 hướng - dùng cho lose-check, không phụ thuộc orient đang chọn của người chơi. */
function canPlaceAnywhere(){
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    if(canPlaceAt(r,c,'H')||canPlaceAt(r,c,'V')) return true;
  }
  return false;
}
function isFull(){ return S.board.every(row=>row.every(Boolean)); }

/* ------------------------------ RENDER ------------------------------------ */
const $=id=>document.getElementById(id);
const boardEl=$('board');
function cellEl(r,c){ return boardEl.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); }
function cellRect(r,c){ const el=cellEl(r,c); return el ? el.getBoundingClientRect() : {left:0,top:0,width:40,height:40}; }

function renderBoard(){
  boardEl.style.gridTemplateColumns=`repeat(${SIZE},1fr)`;
  let h='';
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)
    h+=`<div class="cell" data-r="${r}" data-c="${c}">${tileHTML(S.board[r][c])}</div>`;
  boardEl.innerHTML=h;
}
function renderPiece(){
  const p=$('p-current');
  p.className = S.orient==='V' ? 'vert' : '';
  p.innerHTML = tileHTML(S.current.tiles[0]) + tileHTML(S.current.tiles[1]);
  $('p-next').innerHTML = tileHTML(S.next.tiles[0]) + tileHTML(S.next.tiles[1]);
}
function renderHUD(){ $('h-score').textContent=S.score; $('h-pops').textContent=S.pops; $('h-placed').textContent=S.placed; }
function renderAll(){ renderBoard(); renderPiece(); renderHUD(); }

function floatTxt(x,y,txt,color){
  if(S.fast) return;
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  if(color) d.style.color=color;
  d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function sparks(x,y,color,n){
  if(S.fast) return;
  for(let i=0;i<(n||8);i++){
    const s=document.createElement('div'); s.className='spark';
    s.style.left=x+'px'; s.style.top=y+'px'; s.style.background=color||'#e8b64c';
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2, d=20+Math.random()*26;
    s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},
               {transform:`translate(${Math.cos(a)*d-4}px,${Math.sin(a)*d-4}px) scale(0)`,opacity:0}],
              {duration:400+Math.random()*240, easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>s.remove(),700);
  }
}
function flashBad(el){ if(!el) return; el.classList.add('shakebad'); setTimeout(()=>el.classList.remove('shakebad'),320); }
function toast(msg,ms){
  const t=$('toast'); t.innerHTML=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms||1600);
}

/* ------------------------------ PREVIEW (hover, chỉ desktop) -------------- */
function clearPreview(){ boardEl.querySelectorAll('.cell').forEach(e=>e.classList.remove('ghost','ghostbad')); }
function showPreview(r,c){
  clearPreview();
  const ok=canPlaceAt(r,c,S.orient);
  targetCells(r,c,S.orient).forEach(([rr,cc])=>{
    if(!inBounds(rr,cc)) return;
    const el=cellEl(rr,cc); if(el) el.classList.add(ok?'ghost':'ghostbad');
  });
}
const hoverable = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(hoverable){
  boardEl.addEventListener('mousemove',e=>{
    if(S.busy||S.over) return;
    const ce=e.target.closest('.cell'); if(!ce){ clearPreview(); return; }
    showPreview(+ce.dataset.r, +ce.dataset.c);
  });
  boardEl.addEventListener('mouseleave',clearPreview);
}

/* ------------------------------ RESOLUTION -------------------------------- */
/** Sau khi đặt domino tại 2 ô cellA/cellB: tự nổ nếu 2 nửa trùng nhau; nếu không,
 *  xét riêng từng nửa với láng giềng đã có sẵn (tối đa 2 cặp nổ / 1 lần đặt - bản
 *  hook-test không làm nổ dây chuyền sâu, theo đúng mức tối thiểu của spec). */
function resolvePlacement(cellA, cellB, tileA, tileB){
  const events=[]; // {cells:[[r,c],[r,c]], reason}
  if(tileA.id===tileB.id){
    events.push({cells:[cellA,cellB], reason:'self'});
    return events;
  }
  const cleared=new Set();
  function key(rc){ return rc[0]+','+rc[1]; }
  [[cellA,tileA],[cellB,tileB]].forEach(([cell,tile])=>{
    if(cleared.has(key(cell))) return;
    for(const [nr,nc] of neighbors(cell[0],cell[1])){
      if(cleared.has(nr+','+nc)) continue;
      const other=S.board[nr][nc];
      if(other && other.id===tile.id){
        events.push({cells:[cell,[nr,nc]], reason:'neighbor'});
        cleared.add(key(cell)); cleared.add(nr+','+nc);
        break;
      }
    }
  });
  return events;
}

/* ------------------------------ ACTIONS ------------------------------------ */
async function placeAt(r,c){
  if(S.busy||S.over) return;
  if(!canPlaceAt(r,c,S.orient)){ flashBad(cellEl(r,c)); toast('Không đặt được ở đây'); return; }
  S.busy=true; clearPreview();

  const cells=targetCells(r,c,S.orient);
  const tiles=S.current.tiles;
  cells.forEach(([rr,cc],i)=>{ S.board[rr][cc]=tiles[i]; });
  S.placed++;
  S.score+=10;
  renderBoard(); renderHUD();
  cells.forEach(([rr,cc])=>{ const el=cellEl(rr,cc), tl=el&&el.querySelector('.tile'); if(tl) tl.classList.add('drop'); });
  sfx.place();
  await new Promise(r2=>setTimeout(r2, S.fast?0:150));

  const events=resolvePlacement(cells[0],cells[1],tiles[0],tiles[1]);
  for(const ev of events){
    const [c1,c2]=ev.cells;
    const el1=cellEl(c1[0],c1[1]), el2=cellEl(c2[0],c2[1]);
    const t1=el1&&el1.querySelector('.tile'), t2=el2&&el2.querySelector('.tile');
    if(t1) t1.classList.add('pop'); if(t2) t2.classList.add('pop');
    const gain = ev.reason==='self' ? 40 : 30;
    S.score+=gain; S.pops++;
    const rect=el2?el2.getBoundingClientRect():cellRect(c2[0],c2[1]);
    floatTxt(rect.left+rect.width/2, rect.top, '+'+gain, ev.reason==='self'?'#4ec98a':'#e8b64c');
    sparks(rect.left+rect.width/2, rect.top+rect.height/2, '#e8b64c', 8);
  }
  if(events.length) sfx.pop(events.length);
  if(events.length) await new Promise(r2=>setTimeout(r2, S.fast?0:220));
  events.forEach(ev=>ev.cells.forEach(([rr,cc])=>{ S.board[rr][cc]=null; }));

  renderBoard(); renderHUD();

  S.current=S.next; S.next=randDomino();
  renderPiece();
  S.busy=false;

  if(!canPlaceAnywhere()){ lose(); }
}

boardEl.addEventListener('click',e=>{
  const ce=e.target.closest('.cell'); if(!ce) return;
  placeAt(+ce.dataset.r, +ce.dataset.c);
});
$('btn-rotate').addEventListener('click',()=>{
  if(S.busy||S.over) return;
  S.orient = S.orient==='H' ? 'V' : 'H';
  renderPiece(); sfx.rotate();
});

/* ------------------------------ FLOW / OVERLAY ---------------------------- */
function overlay(html){ $('ovcard').innerHTML=html; $('ov').classList.add('on'); }
function closeOv(){ $('ov').classList.remove('on'); }

const HOOK_INTRO='Đặt khối CHÍNH LÀ hành động match — đừng chỉ nghĩ "chỗ nào trống thì đặt", hãy nghĩ "đặt ở đâu để nửa domino này chạm được quân giống nó". Domino không nổ sẽ nằm lại vĩnh viễn.';

function introOverlay(){
  overlay(`<h2>Domino Ghép Hình</h2>
   <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
   <p>${HOOK_INTRO}</p>
   <div class="demo">${tileHTML(T('s3'))}${tileHTML(T('s5'))}<span class="arw">cạnh</span>${tileHTML(T('s5'))}<span class="arw">=</span><b style="color:var(--jade)">NỔ 1 cặp</b></div>
   <ul>
    <li>Bấm 1 ô trên bàn để đặt domino hiện tại, neo tại ô đó theo hướng đang chọn.</li>
    <li>Bấm nút <b class="hl">⟳</b> để xoay domino ngang/dọc trước khi đặt.</li>
    <li>2 nửa domino trùng nhau → tự nổ cả 2. Không trùng → mỗi nửa nổ riêng với láng giềng cùng mặt nếu có.</li>
    <li><b class="dg">Thua</b> khi domino hiện tại không còn chỗ nào (cả 2 hướng) để đặt trên toàn bàn.</li>
   </ul>
   <button class="btn" onclick="__go()">CHƠI</button>`);
}
window.__go=()=>{ closeOv(); ac(); };

const HELP=`<h2>Domino Ghép Hình</h2>
 <div class="sub">Mahjong × Block Puzzle · prototype kiểm chứng hook</div>
 <p>${HOOK_INTRO}</p>
 <ul>
  <li>Bấm ô bàn = đặt domino neo tại đó. Xem trước (desktop: rê chuột) viền vàng = hợp lệ, đỏ = không.</li>
  <li>Tự nổ: 2 nửa domino cùng mặt. Nổ cạnh: 1 nửa domino cùng mặt với láng giềng đã có sẵn.</li>
  <li>Domino không nổ nằm lại vĩnh viễn, dần lấp đầy bàn.</li>
  <li><b class="dg">Thua</b>: quét toàn bàn cả hướng ngang lẫn dọc, không còn vị trí nào đặt được domino hiện tại.</li>
 </ul>
 <button class="btn" onclick="__closehelp()">ĐÓNG</button>`;
window.__closehelp=()=>{ closeOv(); };
$('btn-help').addEventListener('click',()=>overlay(HELP));

function lose(){
  S.over=true; sfx.lose();
  overlay(`<h2 style="color:var(--danger)">HẾT CHỖ ĐẶT</h2>
   <div class="sub">Điểm: <b class="hl">${S.score}</b> · đã nổ ${S.pops} cặp · đã đặt ${S.placed} domino</div>
   <p>Domino hiện tại không còn vị trí hợp lệ nào (cả ngang lẫn dọc) trên toàn bàn.</p>
   <button class="btn" onclick="__restart()">CHƠI LẠI</button>`);
}
window.__restart=()=>{ closeOv(); startGame(); };

function startGame(){
  S.board=emptyBoard(SIZE); S.score=0; S.pops=0; S.placed=0; S.orient='H'; S.busy=false; S.over=false;
  S.current=randDomino(); S.next=randDomino();
  renderAll();
}
window.addEventListener('resize',()=>{ if(!S.busy) renderAll(); });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#app')) e.preventDefault(); });

/* ------------------------------ TEST HOOK / SELFTEST ---------------------- */
window.__digest={ S, T, canPlaceAt, canPlaceAnywhere, resolvePlacement, startGame,
  state:()=>({score:S.score,pops:S.pops,placed:S.placed,over:S.over}) };
(function selftest(){
  const out=[];
  S.board=emptyBoard(SIZE);
  out.push(['canPlaceAt-empty-H', canPlaceAt(0,0,'H')===true]);
  out.push(['canPlaceAt-edge-H-fails', canPlaceAt(0,SIZE-1,'H')===false]);
  S.board[0][1]=T('s1');
  out.push(['canPlaceAt-blocked', canPlaceAt(0,0,'H')===false]);
  S.board=emptyBoard(SIZE);
  let ev=resolvePlacement([0,0],[0,1],T('s3'),T('s3'));
  out.push(['self-match-detected', ev.length===1 && ev[0].reason==='self']);
  S.board[0][2]=T('s5');
  ev=resolvePlacement([0,0],[0,1],T('c2'),T('s5'));
  out.push(['neighbor-match-detected', ev.length===1 && ev[0].reason==='neighbor']);
  S.board=emptyBoard(SIZE);
  out.push(['canPlaceAnywhere-true-on-empty', canPlaceAnywhere()===true]);
  const bad=out.filter(x=>!x[1]);
  console.log('[selftest]', bad.length? 'FAIL '+JSON.stringify(bad) : 'OK ('+out.length+' checks)');
})();

startGame();
introOverlay();
</script>
