<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ý tưởng A — Lệch góc lớn hơn (Bigger edge-offset stack)</title>
<style>
:root{
  --wood:#2b1d16; --wood2:#3d2a20; --panel:#33210f; --panel2:#170f07;
  --cream:#f6ecd8; --cream2:#e6d7ba;
  --gold:#e8b64c; --bamboo:#a7b85a; --bamboo2:#7c8a3e; --bamboo3:#4d5a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, transparent 2px 9px, rgba(255,255,255,.03) 9px 10px, transparent 10px 19px),
    repeating-linear-gradient(4deg, rgba(0,0,0,.05) 0 3px, transparent 3px 30px),
    radial-gradient(120% 80% at 50% -10%, #5a3d2c 0%, var(--wood) 55%, #1b120d 100%);
  color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100%; display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 14px 40px;
}
h1{font-size:17px; letter-spacing:.04em; color:var(--gold); margin:0; text-align:center;}
p.note{font-size:12px; opacity:.72; max-width:420px; text-align:center; line-height:1.5; margin:0 0 4px;}
#board{
  width:min(92vw,360px); display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  background:linear-gradient(160deg,var(--panel),var(--panel2)); border:1px solid rgba(232,182,76,.22);
  border-radius:14px; padding:14px; box-shadow:inset 0 2px 10px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.35);
}
.cell{aspect-ratio:1; position:relative; border-radius:8px; background:rgba(0,0,0,.22); box-shadow:inset 0 0 0 1px rgba(255,255,255,.035); overflow:hidden;}
.tile{position:absolute; border-radius:6px; overflow:hidden;
  background:linear-gradient(155deg,var(--cream),var(--cream2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 3px rgba(0,0,0,.16),
    2px 3px 0 0 var(--bamboo2), 2px 3px 0 1px var(--bamboo3), 3px 5px 7px 0 rgba(0,0,0,.45);}
.tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.back{margin-top:6px; padding:10px 20px; border:0; border-radius:10px; font-size:12.5px; font-weight:800;
  background:linear-gradient(180deg,var(--gold),#c8912e); color:#2a1d0b; text-decoration:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 3px rgba(0,0,0,.22), 0 3px 0 0 #8a611c, 0 5px 8px rgba(0,0,0,.4);}

.tile.floor{inset:0;}
.tile.roof{inset:26% 4% 4% 26%; z-index:2; box-shadow:inset 0 -2px 0 rgba(0,0,0,.2),inset 0 1px 0 #fff,0 0 0 1px rgba(232,182,76,.5),2px 3px 0 0 var(--bamboo2),0 5px 8px rgba(0,0,0,.66);}
</style>
</head>
<body>
<h1>Ý tưởng A — Lệch góc lớn hơn (Bigger edge-offset stack)</h1>
<p class="note">Tile roof (z1) lệch về góc dưới-phải nhiều hơn hiện tại, để lộ 1 dải lớn của tile floor (z0) ở góc trên-trái, thay vì chỉ 1 tam giác nhỏ.</p>
